<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무림혈전 · C 도트 캐릭터 도감</title><style>*{box-sizing:border-box}body{margin:0;background:#141923;color:#eee5d2;font:15px system-ui;padding:24px}main{max-width:1080px;margin:auto}a{color:#91d3d2}h1{font-size:26px;margin:14px 0 4px}p{color:#b9bac1}h2{margin-top:30px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{border:1px solid #414557;border-radius:10px;background:#232939;text-align:center;padding:8px}.card canvas{width:100%;height:auto;image-rendering:pixelated}.card strong{display:block;margin:5px;font-size:13px}.card small{color:#a9afbd}@media(max-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}button{background:#2f3f54;border:1px solid #799297;color:#e7ece9;padding:10px;border-radius:8px}</style><main><a href="./">← 게임으로</a><h1>무림 도트 도감 · 체형과 움직임</h1><p>큰 머리 · 짧은 팔다리 · 굵은 픽셀. 기존 문파와 적 직군을 그대로 유지했습니다.</p><button id="pose">걷기 / 공격 모습 바꾸기</button><h2>12문파 · 아군</h2><div class="grid" id="heroes"></div><h2>세력별 적 · 검수 / 창병 / 궁수 / 살수 / 중갑병 / 거한 / 술사 / 보스</h2><div class="grid" id="enemies"></div></main><script src="vendor/wuxia-sprites.js?v=14"></script><script>
let attack=false;const cards=[],sects=['정파','사파','마교'],labels=['검수','창병','궁수','살수','중갑병','거한','술사','보스'];
function card(parent,name,tag,f,sub,role){const d=document.createElement('div');d.className='card';const c=document.createElement('canvas');c.width=160;c.height=160;const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=tag;d.append(c,strong,small);document.getElementById(parent).append(d);cards.push({c,f,sub,role})}
for(let f=0;f<3;f++)for(let s=0;s<4;s++)card('heroes',WuxiaSprites.heroNames[f][s],sects[f],f,s,'hero');
for(let f=0;f<3;f++)WuxiaSprites.roles.forEach((role,i)=>card('enemies',sects[f]+' '+labels[i],role==='boss'?'장로 · 대장로':'기존 적 직군',f,0,role));
document.getElementById('pose').onclick=()=>{attack=!attack};
function draw(t){for(const a of cards){const g=a.c.getContext('2d');g.clearRect(0,0,160,160);g.imageSmoothingEnabled=false;const phase=1+Math.floor(t/120)%4;g.drawImage(WuxiaSprites.frame(a.f,a.role,a.sub,phase,false,attack),0,0,160,160)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
